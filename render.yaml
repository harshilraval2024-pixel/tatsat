# Render Blueprint — https://render.com/docs/blueprint-spec
# New Blueprint from repo, or: Web Service → Root Directory: backend (matches rootDir below).

# Database: a free Neon Postgres (https://neon.com) is used instead of a Render
# database (Render's free Postgres expires after 30 days). Create the Neon project,
# then paste its connection string into the DATABASE_URL variable in the Render
# dashboard. See backend/README.md ("Free database on Neon").

services:
  - type: web
    name: tatsat-solar-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # set in the Render dashboard (Neon connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tatsat.vercel.app,https://tatsat-nrgs.vercel.app,http://localhost:3000,http://127.0.0.1:3000
